{{- if .Values.eventsService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app: event-service
    app.kubernetes.io/name: {{ include "cinemaabyss.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.eventsService.replicas }}
  selector:
    matchLabels:
      app: event-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: event-service
    spec:
      imagePullSecrets:
        - name: dockerconfigjson
      containers:
      - name: event-service
        image: "{{ .Values.eventsService.image.repository }}:{{ .Values.eventsService.image.tag }}"
        imagePullPolicy: {{ .Values.eventsService.image.pullPolicy | default "IfNotPresent" }}
        ports:
        - name: http
          containerPort: {{ .Values.eventsService.port | default 8082 }}
          protocol: TCP
        env:
        - name: PORT
          value: "{{ .Values.eventsService.port | default 8082 }}"
        {{- range $key, $value := .Values.eventsService.env }}
        - name: {{ $key }}
          value: "{{ $value }}"
        {{- end }}
        readinessProbe:
          httpGet:
            path: /api/events/health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/events/health
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          {{- toYaml .Values.eventsService.resources | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: event-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app: event-service
    app.kubernetes.io/name: {{ include "cinemaabyss.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.eventsService.service.type | default "ClusterIP" }}
  selector:
    app: event-service
  ports:
    - name: http
      port: {{ .Values.eventsService.service.port | default 8082 }}
      targetPort: http
      protocol: TCP
{{- end }}
